name: Daily Article & Market Intelligence Generation

on:
  schedule:
    - cron: '15 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 1. Generate Daily Market Intelligence & Calculator Updates
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 generate_daily_intel.py || echo "Warning: generate_daily_intel.py encountered a non-fatal error"

      - name: 2. Generate Daily Cost Guide (Fault-Tolerant)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 generate_article.py || echo "Warning: generate_article.py encountered a non-fatal error"

      - name: 3. Retrofit & Sync Guides, Sitemap, RSS, and Calculators
        run: |
          python3 retrofit_articles.py
          python3 sync_guides.py

      - name: 4. Validate JSON & Protected Root Assets
        run: |
          for f in regional_multipliers.json commodity_history.json manifest.json; do
            if [ -f "$f" ]; then
              python3 -m json.tool "$f" > /dev/null
            fi
          done

      - name: 5. Commit & Deploy Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated daily SKU cost guide, market intelligence & index sync"
            git pull --rebase origin main
            git push origin main
          fi
