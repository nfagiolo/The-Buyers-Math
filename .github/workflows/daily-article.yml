name: Daily Article & Market Intelligence Generation

on:
  schedule:
    # Runs daily at 10:00 UTC (6:00 AM EDT)
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Optional Dependencies (Fault-Tolerant)
        run: |
          pip install --quiet anthropic requests || echo "Optional packages skipped; standard library fallback active."

      - name: 1. Run Daily Market Intelligence & Live Baseline Engine
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          python3 generate_daily_intel.py

      - name: 2. Generate Daily Cost Guide (Fault-Tolerant)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -f "generate_article.py" ]; then
            python3 generate_article.py || echo "[WARN] generate_article.py skipped non-fatal warning"
          fi

      - name: 3. Sync Guides Archive & Homepage Cards (Fault-Tolerant)
        run: |
          if [ -f "sync_guides.py" ]; then
            python3 sync_guides.py || echo "[WARN] sync_guides.py skipped non-fatal warning"
          fi

      - name: 4. Validate JSON & Protected Root Assets
        run: |
          python3 -m json.tool data/live-baselines.json > /dev/null
          if [ -f "ads.txt" ]; then
            echo "Verified ads.txt is intact."
          fi

      - name: 5. Commit & Deploy Changes
        run: |
          git config user.name "TBM-AutoBot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit today."
          else
            git commit -m "chore(daily): automated market intel, live baselines & guide refresh [$(date -u +'%Y-%m-%d')]"
            git pull --rebase origin main || true
            git push origin main
          fi
