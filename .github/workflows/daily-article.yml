name: Daily Article & Everyday Consumer Math Engine

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      custom_topic:
        description: "Optional custom topic to publish right now (leaves queue untouched if blank)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Optional Dependencies
        run: |
          pip install --quiet anthropic requests pillow || echo "Optional packages skipped; standard library fallback active."

      - name: 1. Run Daily Telemetry & Baseline Engine
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -f "generate_daily_intel.py" ]; then
            python3 generate_daily_intel.py || echo "[WARN] generate_daily_intel.py non-fatal skip"
          fi

      - name: 2. Repair sync_guides.py Keyword Mapping & Generate Daily Consumer Math Showdown
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CUSTOM_TOPIC: ${{ inputs.custom_topic }}
          TOPIC_QUEUE_CSV_URL: "https://docs.google.com/spreadsheets/d/15vl7kt-yD97aR5bbMUxsqEFdwGV20LqxJeXoTu8DKcU/export?format=csv"
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python3 generate_article.py

      - name: 3. Sync Sitemap, RSS Feed & Homepage Cards
        run: |
          if [ -f "sync_guides.py" ]; then
            python3 sync_guides.py || echo "[WARN] sync_guides.py skipped non-fatal warning"
          fi
          python3 generate_article.py --repair-only

      - name: 4. Validate JSON & Global Amazon Associates Tag Enforcement
        run: |
          if [ -f "data/live-baselines.json" ]; then
            python3 -m json.tool data/live-baselines.json > /dev/null
          fi
          find . -type f \( -name "*.html" -o -name "*.js" -o -name "*.json" -o -name "*.py" -o -name "*.xml" \) -exec sed -i "s/nfagiolo-20/thebuyersmath-20/g" {} +

      - name: 5. Commit & Deploy Changes to GitHub Pages
        run: |
          git config user.name "TBM-AutoBot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit today."
          else
            git commit -m "chore(daily): automated consumer math showdown, scorecard & CTA sync [$(date -u +'%Y-%m-%d')]"
            git pull --rebase origin main || true
            git push origin main
          fi
