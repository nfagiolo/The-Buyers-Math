name: Daily Article & Market Intelligence Generation

on:
  schedule:
    - cron: '0 10 * * *' # Daily at 10:00 UTC (6:00 AM EDT)
  workflow_dispatch:      # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic

      - name: Apply Calculator Updates & Enhancements
        run: |
          if [ -f "apply_calculator_updates.py" ]; then
            python apply_calculator_updates.py
          fi

      - name: Retrofit Monetization on Existing Articles
        run: |
          if [ -f "retrofit_articles.py" ]; then
            python retrofit_articles.py
          fi

      - name: Generate Daily Deep-Dive Article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -f "generate_article.py" ]; then
            python generate_article.py
          fi

      - name: Generate Daily Market & Contractor Intelligence (5-Part Suite)
        run: |
          if [ -f "generate_daily_intel.py" ]; then
            python generate_daily_intel.py
          fi

      - name: Sync Guides, Archive, and RSS Feed
        run: |
          if [ -f "sync_guides.py" ]; then
            python sync_guides.py
          fi

      - name: Apply OpenGraph, Twitter Cards & Schema.org Tags
        run: |
          if [ -f "apply_seo_social_tags.py" ]; then
            python apply_seo_social_tags.py
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-generate daily article, market intelligence dispatch & feeds [skip ci]"
            git push origin main
          fi
