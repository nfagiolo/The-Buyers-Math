name: Daily Article & Market Intelligence Generation

on:
  schedule:
    - cron: '0 10 * * *' # Daily at 10:00 UTC (6:00 AM EDT)
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic requests

      - name: 1. Generate Daily Market & Contractor Intelligence (5-Part Suite + 30-Day Sparklines)
        run: |
          if [ -f "generate_daily_intel.py" ]; then
            python generate_daily_intel.py
          fi

      - name: 2. Generate Daily Deep-Dive Article (with SVG Chart, Shoppable BOM & Quote Auditor)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -f "generate_article.py" ]; then
            python generate_article.py
          fi

      - name: 3. Retrofit Existing Articles (SVG Charts, BOM Tables, Quote Auditor & Clean Titles)
        run: |
          if [ -f "retrofit_articles.py" ]; then
            python retrofit_articles.py
          fi

      - name: 4. Apply Calculator Updates (50-State Multipliers, Live Commodity Badges & CJ Angi Links)
        run: |
          if [ -f "apply_calculator_updates.py" ]; then
            python apply_calculator_updates.py
          fi

      - name: 5. Sync Editorial Homepage, Guides Archive, Sitemap, RSS & Bidirectional Calculator Links
        run: |
          if [ -f "sync_guides.py" ]; then
            python sync_guides.py
          fi

      - name: 6. Apply OpenGraph, Twitter Cards & Schema.org Tags
        run: |
          if [ -f "apply_seo_social_tags.py" ]; then
            python apply_seo_social_tags.py
          fi

      - name: 7. Commit, Push & Trigger GitHub Pages Deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-generate daily article, market intelligence, sparklines & bidirectional calculator sync"
            git push origin main
            gh api -X POST /repos/${{ github.repository }}/pages/builds || true
          fi
