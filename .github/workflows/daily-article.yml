name: Daily Automated Operations (The Buyer's Math)

on:
  schedule:
    # Runs daily at 08:00 UTC (4:00 AM EDT / America/New_York)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger anytime from Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install anthropic

      - name: 1. Update Core Calculators (Checklists & Related Tools)
        run: |
          if [ -f apply_calculator_updates.py ]; then
            python apply_calculator_updates.py
          fi

      - name: 2. Retrofit Existing Articles (Revenue Blocks)
        run: |
          if [ -f retrofit_articles.py ]; then
            python retrofit_articles.py
          fi

      - name: 3. Generate Daily High-Intent Guide (Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python generate_article.py

      - name: 4. Rebuild Guides Archive & Sync Homepage
        run: |
          if [ -f sync_guides.py ]; then
            python sync_guides.py
          fi

      - name: Commit and Push All Site Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Auto-update calculators, publish daily guide, and sync archive" && git push origin main)
