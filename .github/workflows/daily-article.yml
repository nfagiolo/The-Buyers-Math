name: Daily Automated Cost Guide (Anthropic)

on:
  schedule:
    # Runs daily at 10:00 UTC (6:00 AM EST)
    - cron: '0 10 * * *'
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install anthropic

     - name: Run Article Generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python retrofit_articles.py
          python generate_article.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add articles/ index.html sitemap.xml
          git diff --staged --quiet || (git commit -m "Auto-generate daily buying guide via Claude and update sitemap" && git push origin main)
