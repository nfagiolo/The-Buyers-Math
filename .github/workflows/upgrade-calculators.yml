name: Upgrade All Calculators (Hardware Grids)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-calculators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inject Hardware Cards
        run: |
          python inject_hardware_cards.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.html
          git diff --staged --quiet || (git commit -m "Inject Amazon hardware recommendations across all calculators" && git push origin main)
