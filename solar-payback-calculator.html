<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1199906473460957" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Solar Payback Calculator</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f8fafc; color: #1e293b; padding: 2rem; max-width: 800px; margin: 0 auto; }
        .card { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        input, button { width: 100%; padding: 0.75rem; margin-top: 0.5rem; margin-bottom: 1.5rem; border-radius: 6px; border: 1px solid #cbd5e1; }
        button { background: #0284c7; color: white; font-weight: bold; cursor: pointer; border: none; }
        .result { font-size: 1.5rem; font-weight: bold; color: #15803d; text-align: center; padding: 1rem; background: #f0fdf4; border-radius: 8px; }
        .alert { background: #fffbeb; border-left: 4px solid #f59e0b; padding: 1rem; margin-bottom: 1.5rem; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h1>Solar Panel Payback Timeline</h1>
    
    <div class="alert">
        <strong>2026 Policy Update:</strong> The 30% Federal Solar Tax Credit for cash/loan purchases expired on Dec 31, 2025. This calculator reflects unsubsidized 2026 gross system costs.
    </div>

    <div class="card">
        <label>Average Monthly Electric Bill ($)</label>
        <input type="number" id="bill" value="200">

        <label>System Gross Cost ($) - Industry average is $25k to $35k</label>
        <input type="number" id="cost" value="30000">

        <button onclick="calcSolar()">Calculate Payback Period</button>
        <div class="result" id="solarTotal">0 Years</div>
    </div>

    <script>
        function calcSolar() {
            const bill = parseFloat(document.getElementById('bill').value) || 0;
            const cost = parseFloat(document.getElementById('cost').value) || 0;
            
            const annualSavings = bill * 12;
            const years = cost / annualSavings;
            
            document.getElementById('solarTotal').innerText = "Payback Period: " + years.toFixed(1) + " Years";
        }
        calcSolar();
    </script>
</body>
</html>
